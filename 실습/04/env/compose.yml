# 4장 실습용 n8n 실행 구성
#
# 3장 구성(db, n8n)에 하루마켓 모의 주문 API(mock-api)를 더했다.
#   db       : PostgreSQL. n8n 데이터베이스와 harumarket 업무 데이터베이스, n8n_exam 예제 데이터베이스를 담는다(3장과 같다)
#   n8n      : n8n 본체. 브라우저로 http://localhost:5678 에 접속한다(3장과 같다)
#   mock-api : 하루마켓 모의 주문 API. n8n 안에서는 http://mock-api:8000 으로 부른다
#
# 실행 순서(자세한 설명은 4장 실습 문서의 '실습 4-2' 1단계)
#   1. 작업 폴더에 04/ 폴더를 만들고 이 폴더의 compose.yml, 환경변수_예시.env, 업무DB_초기화.sql, 예제DB_초기화.sql,
#      mock-api 폴더를 복사한다.
#   2. .env 파일을 만든다.
#      - 3장 환경을 쓰던 경우: 3장 폴더의 .env를 04/ 폴더로 복사하고 맨 아래에 MOCK_API_KEY 한 줄을 더한다.
#        3장의 비밀번호와 암호화 키는 바꾸지 않는다. 키가 바뀌면 3장에서 저장한 자격 증명을 열 수 없다.
#      - 처음 시작하는 경우: 환경변수_예시.env를 .env로 복사하고 자리표시자를 모두 채운다.
#        비밀번호와 암호화 키를 만드는 방법은 3장 실습 3-1의 1단계에 있다.
#   3. 3장 환경이 실행 중이면 3장 폴더에서 내린다. -v를 붙이지 않으므로 볼륨(데이터)은 남는다.
#        docker compose down
#   4. 04/ 폴더에서 실행한다. 프로젝트 이름(n8n-textbook)이 3장과 같아 3장의 볼륨을 그대로 쓴다.
#        docker compose up -d
#   5. db, n8n, mock-api 세 서비스가 실행 중인지 확인한다.
#        docker compose ps
#   6. 모의 API가 응답하는지 확인한다. {"status": "ok", "as_of": "2026-09-10"}가 오면 된다.
#        curl http://localhost:8000/health        (PowerShell에서는 curl.exe)
#   7. 브라우저로 http://localhost:5678 에 접속해 3장의 워크플로우와 자격 증명이 남아 있는지 확인한다.
#
# docker compose down -v 는 볼륨까지 지워 3장부터 만든 워크플로우와 데이터가 모두 사라진다.
# 처음부터 다시 만들 때만 쓴다.

name: n8n-textbook

services:
  db:
    image: postgres:17
    restart: unless-stopped
    ports:
      # 왼쪽이 내 컴퓨터의 포트, 오른쪽이 컨테이너 안의 포트다(3장과 같다).
      # 5432가 이미 쓰이고 있으면 왼쪽 숫자만 바꾼다(예: "15432:5432").
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
      TZ: ${TIMEZONE}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./업무DB_초기화.sql:/docker-entrypoint-initdb.d/10-harumarket.sql:ro
      # 예제용 데이터베이스 n8n_exam을 만든다. 위 스크립트 다음에 실행된다.
      - ./예제DB_초기화.sql:/docker-entrypoint-initdb.d/20-n8n-exam.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 20

  n8n:
    image: n8nio/n8n:2.43.7
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mock-api:
        condition: service_started
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${TIMEZONE}
      TZ: ${TIMEZONE}
      N8N_RUNNERS_ENABLED: "true"
      # 외부 서비스가 n8n을 호출할 공개 주소. Webhook 노드의 주소를 이 값으로 만든다.
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      # n8n 앞에서 요청을 전달하는 프록시의 수. ngrok 하나이므로 1이다.
      N8N_PROXY_HOPS: 1
      # 편집 화면 주소. OAuth 콜백 주소와 실행 기록 링크도 이 값으로 만든다. 포트를 바꾸면 이 번호도 바꾼다.
      N8N_EDITOR_BASE_URL: http://localhost:5678
    volumes:
      - n8n_data:/home/node/.n8n

  mock-api:
    # 이미지를 새로 만들지 않고 공식 Python 이미지로 서버 파일을 그대로 실행한다.
    image: python:3.13-slim
    restart: unless-stopped
    working_dir: /app
    command: ["python", "server.py"]
    environment:
      # n8n 자격 증명에 넣을 키와 같은 값이어야 한다.
      MOCK_API_KEY: ${MOCK_API_KEY}
      # 날짜 계산의 기준일. 실습 사례가 모두 이 날짜를 기준으로 한다.
      # 따옴표를 지우면 날짜 값으로 바뀌어 서버가 읽지 못한다.
      MOCK_TODAY: "2026-09-10"
      PYTHONUNBUFFERED: "1"
    ports:
      # 내 컴퓨터에서 명세를 확인하며 직접 호출해 볼 때 쓴다.
      - "8000:8000"
    volumes:
      # 서버 코드와 데이터. 읽기 전용으로 연결한다.
      - ./mock-api:/app:ro

volumes:
  n8n_data:
  db_data:
