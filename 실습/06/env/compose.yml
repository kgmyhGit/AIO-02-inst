# 6장 실습용 n8n 실행 구성
#
# 5장 구성(db, n8n, mock-api)에서 mock-api를 바꾸었다.
#   n8n      : 5장과 같다. 메일의 응답 링크는 3장에서 받은 공개 주소(N8N_WEBHOOK_URL)로 만든다
#   mock-api : 집행 키(MOCK_EXEC_KEY)와 집행 기록을 저장할 볼륨(mock_state)을 더한다
#   db       : 5장과 같다. 데이터 볼륨(db_data)도 그대로 쓴다
#
# 사용 방법은 6장 실습 문서의 '실습 6-3' 1단계를 따른다.
# 5장에서 쓰던 폴더의 compose.yml을 이 파일로 바꾸고, 같은 폴더의 mock-api 폴더를
# 6장 것으로 바꾼다. .env 파일에는 MOCK_EXEC_KEY를 더 채운다.

name: n8n-textbook

services:
  db:
    # 5장과 같다. pgvector 확장이 들어 있는 이미지다.
    image: pgvector/pgvector:0.8.6-pg17-trixie
    restart: unless-stopped
    ports:
      # 왼쪽이 내 컴퓨터의 포트, 오른쪽이 컨테이너 안의 포트다(3장과 같다).
      # 5432가 이미 쓰이고 있으면 왼쪽 숫자만 바꾼다(예: "15432:5432").
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
      TZ: ${TIMEZONE}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./업무DB_초기화.sql:/docker-entrypoint-initdb.d/10-harumarket.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 20

  n8n:
    image: n8nio/n8n:2.43.7
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mock-api:
        condition: service_started
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${TIMEZONE}
      TZ: ${TIMEZONE}
      N8N_RUNNERS_ENABLED: "true"
      N8N_RESTRICT_FILE_ACCESS_TO: /files
      # 3장에서 받은 공개 주소. Webhook 노드와 폼의 주소, 메일의 응답 링크를 이 값으로 만든다.
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      # n8n 앞에서 요청을 전달하는 프록시의 수. ngrok 하나이므로 1이다.
      N8N_PROXY_HOPS: 1
      # 편집 화면 주소. OAuth 콜백 주소와 실행 기록 링크도 이 값으로 만든다. 포트를 바꾸면 이 번호도 바꾼다.
      N8N_EDITOR_BASE_URL: http://localhost:5678
    volumes:
      - n8n_data:/home/node/.n8n
      - ./policies:/files/policies:ro

  mock-api:
    image: python:3.13-slim
    restart: unless-stopped
    working_dir: /app
    command: ["python", "server.py"]
    environment:
      # 조회 전용 키. 4장부터 쓰던 값이다. 집행 엔드포인트에서는 403을 받는다.
      MOCK_API_KEY: ${MOCK_API_KEY}
      # 집행 키. 환불과 교환 발송에만 쓴다. 조회 키와 같은 값이면 서버가 시작하지 않는다.
      MOCK_EXEC_KEY: ${MOCK_EXEC_KEY}
      MOCK_TODAY: "2026-09-10"
      # 집행 기록을 저장할 폴더. 아래 mock_state 볼륨이 이 경로에 연결된다.
      MOCK_STATE_DIR: /app/state
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    volumes:
      # 서버 코드와 데이터. 읽기 전용이다.
      - ./mock-api:/app:ro
      # 집행 기록만 쓸 수 있는 곳이다. 컨테이너를 다시 시작해도 기록이 남는다.
      - mock_state:/app/state

volumes:
  n8n_data:
  db_data:
  mock_state:
